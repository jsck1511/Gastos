<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="theme-color" content="#1877f2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gastos</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14171a;--mut:#6b7280;--ac:#1877f2;--ok:#16a34a;--bd:#e3e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1114;--card:#1a1d22;--tx:#eceff3;--mut:#9aa3ae;--bd:#2a2f36}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
h1{margin:0;font-size:26px}
#estado{font-size:13px;color:var(--mut)}
#cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cat{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 14px;font-size:15px}
.cat.on{background:var(--ac);border-color:var(--ac);color:#fff}
input{width:100%;font-size:17px;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
button.main{width:100%;font-size:18px;font-weight:600;padding:15px;border:0;border-radius:12px;background:var(--ac);color:#fff}
ul{list-style:none;padding:0;margin:20px 0}
li{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
li small{display:block;color:var(--mut);margin-top:2px}
li b{white-space:nowrap}
.ok{color:var(--ok)}
details{margin-top:10px;color:var(--mut)}
summary{padding:8px 0}
details input{margin-top:6px}
</style>
</head>
<body>
<main>
  <header><h1>Gastos</h1><span id="estado"></span></header>
  <div id="cats"></div>
  <input id="concepto" placeholder="Qué compraste (ej: zapatillas adidas)" autocomplete="off">
  <input id="monto" inputmode="decimal" placeholder="Monto">
  <button class="main" id="guardar">Guardar</button>
  <ul id="lista"></ul>
  <details id="cfg">
    <summary>⚙ Configuración</summary>
    <input id="url" placeholder="URL de Apps Script (termina en /exec)" autocapitalize="off" autocorrect="off">
    <input id="token" placeholder="Token (opcional)" autocapitalize="off" autocorrect="off">
    <button class="main" id="sg">Guardar configuración</button>
  </details>
</main>
<script>
const CATS=['Auto','Comida','Transporte','Salud','Ocio','Estudio','Hogar','Ropa','Otros'];
const $=s=>document.querySelector(s);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let queue=load('queue',[]), hist=load('hist',[]), cfg=load('cfg',{url:'',token:''}), cat='Auto', syncing=false;
const persist=()=>{localStorage.setItem('queue',JSON.stringify(queue));localStorage.setItem('hist',JSON.stringify(hist));localStorage.setItem('cfg',JSON.stringify(cfg))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function renderCats(){
  $('#cats').replaceChildren(...CATS.map(c=>{
    const b=document.createElement('button');
    b.className='cat'+(c===cat?' on':''); b.textContent=c;
    b.onclick=()=>{cat=c;renderCats()};
    return b;
  }));
}
function render(){
  $('#lista').replaceChildren(...hist.slice(0,20).map(h=>{
    const li=document.createElement('li');
    const l=document.createElement('div');
    l.textContent=h.concepto||h.texto||'';
    const s=document.createElement('small');
    s.textContent=(h.categoria||'Auto')+' · '+new Date(h.fecha).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · '+(h.sync?'✓ subido':'⏳ pendiente');
    if(h.sync) s.className='ok';
    l.appendChild(s);
    const r=document.createElement('b');
    r.textContent=h.monto!==undefined&&h.monto!==''?'$'+Number(h.monto).toLocaleString('es-AR'):'';
    li.append(l,r); return li;
  }));
  const n=queue.length;
  $('#estado').textContent=!navigator.onLine?('Sin conexión'+(n?` · ${n} pendientes`:'')):(n?`⏳ ${n} pendientes`:'✓ al día');
}
function add(){
  const c=$('#concepto').value.trim(), mTxt=$('#monto').value.trim();
  if(!c&&!mTxt) return;
  const g={id:uid(),fecha:new Date().toISOString(),origen:'app'};
  if(mTxt){
    const m=parseFloat(mTxt.replace(',','.'));
    if(isNaN(m)){alert('Monto inválido');return}
    g.monto=m; g.concepto=c||(cat!=='Auto'?cat:'Sin concepto');
    if(cat!=='Auto') g.categoria=cat;
  } else {
    g.texto=c;               // "zapatillas adidas 5000" -> lo parsea el servidor
    if(cat!=='Auto') g.categoria=cat;
  }
  queue.push(g); hist.unshift({...g,sync:false}); hist=hist.slice(0,50);
  $('#concepto').value=''; $('#monto').value='';
  persist(); render(); sync();
}
async function sync(){
  if(syncing||!queue.length||!cfg.url||!navigator.onLine) return;
  syncing=true;
  const batch=queue.slice();
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,gastos:batch})});
    const j=await r.json();
    if(j.ok){
      const ids=new Set(batch.map(x=>x.id));
      queue=queue.filter(x=>!ids.has(x.id));
      const byId=Object.fromEntries((j.res||[]).map(x=>[x.id,x]));
      hist.forEach(h=>{if(ids.has(h.id)){h.sync=true;const x=byId[h.id];if(x){h.categoria=x.categoria;h.concepto=x.concepto;h.monto=x.monto}}});
    }
  }catch(e){}
  syncing=false; persist(); render();
}
$('#guardar').onclick=add;
$('#concepto').addEventListener('keydown',e=>{if(e.key==='Enter')$('#monto').focus()});
$('#monto').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
$('#sg').onclick=()=>{cfg={url:$('#url').value.trim(),token:$('#token').value.trim()};persist();$('#cfg').open=false;sync()};
$('#url').value=cfg.url; $('#token').value=cfg.token;
if(!cfg.url) $('#cfg').open=true;
addEventListener('online',()=>{render();sync()});
addEventListener('offline',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setInterval(sync,20000);
renderCats(); render(); sync();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
